name: Chinese Switch build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Switch audio dependencies
        run: dkp-pacman -Q switch-sdl2_mixer || dkp-pacman -Sy --needed --noconfirm switch-sdl2_mixer
      - name: Prepare pinned engine and resources
        run: python3 tools/prepare.py
      - name: Check Chinese text decoding and glyph coverage
        run: gcc -std=c99 -Wall -Wextra -Iengine tests/zh_text_test.c -o /tmp/zh-test && /tmp/zh-test
      - name: Build self-contained Switch executable
        run: bash tools/build-switch.sh
      - name: Prepare NSP application files (no keys)
        run: bash tools/prepare-nsp.sh
      - name: Prepare NRO forwarder files (no keys)
        run: python3 tools/prepare-forwarder.py
      - uses: actions/upload-artifact@v4
        with:
          name: NZP-ZH-Switch-build
          path: dist/
          if-no-files-found: error

  release-preview:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NZP-ZH-Switch-build
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.6-zh-preview
          name: 使命召唤：纳粹僵尸 0.1.6 NRO
          prerelease: true
          body: |
            Chinese Switch build with embedded game resources. This is an NRO preview, not the final NSP.
            Cross-compilation and embedded RomFS checks passed; Switch hardware gameplay has not been verified.
            Run in full-memory homebrew mode. No separate game resource folder is required.
            中文首批适配；未完成全部动态提示、角色介绍及贴图文字汉化。实机运行、声音、帧率待测试。
            Source and licenses are available in this repository and the pinned upstream commits in README.md.
          files: |
            dist/NZP-ZH-Standalone.nro
            dist/SHA256SUMS.txt
