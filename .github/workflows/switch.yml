name: Chinese Switch build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Switch audio dependencies
        run: dkp-pacman -Q switch-sdl2_mixer || dkp-pacman -Sy --needed --noconfirm switch-sdl2_mixer
      - name: Prepare pinned engine and resources
        run: python3 tools/prepare.py
      - name: Check Chinese text decoding and glyph coverage
        run: gcc -std=c99 -Wall -Wextra -Iengine tests/zh_text_test.c -o /tmp/zh-test && /tmp/zh-test
      - name: Build self-contained Switch executable
        run: bash tools/build-switch.sh
      - name: Prepare NSP application files (no keys)
        run: bash tools/prepare-nsp.sh
      - name: Prepare NRO forwarder files (no keys)
        run: python3 tools/prepare-forwarder.py
      - uses: actions/upload-artifact@v4
        with:
          name: NZP-ZH-Switch-build
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NZP-ZH-Switch-build
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: 使命召唤：纳粹僵尸 0.2.0
          prerelease: false
          body: |
            使命召唤：纳粹僵尸 0.2.0；作者 Xiao Fan。
            1280×720，高清中文字体，19 张内置地图名称与介绍已汉化。
            使用已由用户实机验证进入主菜单并正常开局的原生启动配置。
            新增 Switch 默认开启体感：首次升级启用一次，之后保留手动关闭设置。
            本次体感默认设置尚需实机反馈；角色介绍与部分贴图文字仍未全部汉化。
            NRO 内嵌游戏资源；使用前端时放置到 sdmc:/switch/cod-zombies/cod-zombies.nro。
            原生 NSP 由同一构建在本地使用私有密钥打包；仓库不保存密钥。
            Source, upstream pins and licenses are in this repository.
          files: |
            dist/NZP-ZH-Standalone.nro
            dist/SHA256SUMS.txt
