name: Desktop visual verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop verification dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsdl2-dev libsdl2-mixer-dev libgl1-mesa-dev libglu1-mesa-dev xvfb xauth scrot xdotool python3-pil
      - name: Prepare same Chinese source and resource set
        run: python3 tools/prepare.py
      - name: Build desktop verification executable
        run: make -C engine -f Makefile.sdl -j2
      - name: Capture actual menu and map renders
        run: xvfb-run -a -s '-screen 0 960x540x24' python3 tools/capture-desktop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NZP-ZH-Desktop-Screenshots-and-Logs
          path: screenshots/
          if-no-files-found: error
